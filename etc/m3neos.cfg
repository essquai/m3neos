%
% Bind these two items together
%
wasm = ""
if defined ("TARGET") 
    if equal(TARGET, "Wasm32") wasm = "TRUE" end
    if equal(TARGET, "wasm32") wasm = "TRUE" end
    if equal(TARGET, "WASM")   wasm = "TRUE" end
    if equal(TARGET, "wasm")   wasm = "TRUE" end
end
if wasm
    M3_BACKEND = "Wasm"
    TARGET     = "wasm32"
end
if not defined("SL") SL = "/" end
if not defined ("M3_BACKEND") M3_BACKEND = "C" end
if not defined("TARGET") TARGET = "x86_64" end
INSTALL_ROOT = (path() & SL & "..")
include(path() & SL & ".." & SL & "etc" & SL & TARGET)
